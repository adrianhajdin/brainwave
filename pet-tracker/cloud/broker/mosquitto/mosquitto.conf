# Self-hosted broker reference (Eclipse Mosquitto 2.x) - e.g. DigitalOcean/Render.
# Mutual TLS only: no anonymous clients, no passwords, no plaintext listener.
per_listener_settings true

listener 8883
protocol mqtt
cafile   /mosquitto/pki/ca.crt
certfile /mosquitto/pki/server.crt
keyfile  /mosquitto/pki/server.key
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-SHA256
require_certificate true
# The certificate CN becomes the MQTT username => ACL identity.
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# Persistent sessions so QoS 1 downlinks wait for devices in PSM.
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 14d
max_queued_messages 50
max_packet_size 8192
max_keepalive 1800
