#
# Development overlay: UART logging and short intervals.
# NEVER ship this: it adds ~0.6 mA idle current and exposes a debug interface
# (EN 18031-1 GEC-2: only necessary interfaces enabled in production).
#
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_TRACKER_LOG_LEVEL_DBG=y
CONFIG_TFM_LOG_LEVEL_SILENCE=n

CONFIG_TRACKER_MOVING_INTERVAL_S=120
CONFIG_TRACKER_STATIONARY_INTERVAL_S=900
