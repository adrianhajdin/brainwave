#
# Secure boot chain (sysbuild)
#
# MCUboot is the immutable first-stage bootloader:
#  - ECDSA-P256 signature check of every application image before boot
#  - ECIES-P256 + AES-128 encrypted update images (decrypted during swap)
#  - hardware anti-rollback: security counter in OTP (UICR), bumped per release
#
# !!! The default key paths below point to MCUboot's PUBLIC SAMPLE KEYS. !!!
# Production builds MUST override them with keys generated and held in an
# HSM / signing service, e.g.:
#   west build ... -- \
#     -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"/secure/pt-sign-p256.pem\" \
#     -DSB_CONFIG_BOOT_ENCRYPTION_KEY_FILE=\"/secure/pt-enc-p256.pem\"
#
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_ENCRYPTION=y
SB_CONFIG_MCUBOOT_HARDWARE_DOWNGRADE_PREVENTION=y
# Increment for every release that must not be rolled back.
SB_CONFIG_MCUBOOT_HW_DOWNGRADE_PREVENTION_COUNTER_VALUE=1
