#
# Thingy:91 (nRF9160 + ADXL362): reference hardware for the motion logic.
#
# ADXL362 in linked + referenced mode with autosleep: one interrupt when
# motion starts, one after 5 min of stillness; ~270 nA while asleep.
#   ODR 12.5 Hz, +-2 g (1 mg/LSB)
#   activity:   >150 mg for 3 samples (~240 ms)
#   inactivity: <100 mg for 3750 samples (5 min)
#
CONFIG_SENSOR=y
CONFIG_ADXL362=y
CONFIG_ADXL362_TRIGGER_GLOBAL_THREAD=y
CONFIG_ADXL362_ACCEL_RANGE_2G=y
CONFIG_ADXL362_ACCEL_ODR_12_5=y
CONFIG_ADXL362_INTERRUPT_MODE=1
CONFIG_ADXL362_ABS_REF_MODE=1
CONFIG_ADXL362_ACTIVITY_THRESHOLD=150
CONFIG_ADXL362_ACTIVITY_TIME=3
CONFIG_ADXL362_INACTIVITY_THRESHOLD=100
CONFIG_ADXL362_INACTIVITY_TIME=3750
