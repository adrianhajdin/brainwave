#
# Pet tracker - PRODUCTION configuration (secure & low-power by default).
# For development add:  -DEXTRA_CONF_FILE=overlay-debug.conf
#

# =============================================================================
# LTE-M / NB-IoT link (lte_lc applies all of this at modem init)
# =============================================================================
CONFIG_NRF_MODEM_LIB=y
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE=n
CONFIG_LTE_LINK_CONTROL=y

# LTE-M first: connected-mode mobility (a moving pet), lower latency and far
# shorter radio-on time per TLS exchange than NB-IoT. NB-IoT as fallback for
# deep-indoor coverage. GPS enabled in the system mode.
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
CONFIG_LTE_MODE_PREFERENCE_LTE_M=y

# 1NCE APN, IPv4 only (IPv6 doubles PDN setup signalling for no benefit here)
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="iot.1nce.net"
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y

# --- Power Saving Mode -------------------------------------------------------
# Requested values (3GPP TS 24.008); the network may grant different ones -
# the granted values are logged on LTE_LC_EVT_PSM_UPDATE.
#   Periodic TAU (T3412ext) "001 01100" = 12 x 1 h  = 12 h
#   Active time  (T3324)    "000 00011" =  3 x 2 s  =  6 s
# The long TAU keeps "keep-alive" signalling to two per day; the device is
# always the initiator (reports), so it never needs to be pageable for long.
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_STRING=y
CONFIG_LTE_PSM_REQ_RPTAU="00101100"
CONFIG_LTE_PSM_REQ_RAT="00000011"

# --- eDRX: only used in "lost mode" (cloud command, PSM off) ----------------
#   LTE-M eDRX "0101" = 81.92 s paging cycle; PTW "0000" = 1.28 s
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_EDRX_REQ=n
CONFIG_LTE_EDRX_REQ_VALUE_LTE_M="0101"
CONFIG_LTE_PTW_VALUE_LTE_M="0000"

# --- Release Assistance Indication: skip the RRC inactivity tail -------------
CONFIG_LTE_LC_RAI_MODULE=y
CONFIG_LTE_RAI_REQ=y

CONFIG_LTE_LC_MODEM_SLEEP_MODULE=y
CONFIG_LTE_NETWORK_TIMEOUT=600

# Battery voltage via %XVBAT
CONFIG_AT_MONITOR=y
CONFIG_MODEM_BATTERY=y

# =============================================================================
# A-GNSS: assistance data is fetched by our backend and injected locally,
# so the device never talks to a third-party cloud directly.
# =============================================================================
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_MQTT=n
CONFIG_NRF_CLOUD_COAP=n
CONFIG_NRF_CLOUD_AGNSS=y

# =============================================================================
# MQTT over TLS (TLS runs inside the modem; credentials in modem key storage)
# =============================================================================
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_JSON_LIBRARY=y

# =============================================================================
# FOTA (signed + encrypted MCUboot images over HTTPS)
# =============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_DFU_TARGET=y
CONFIG_DOWNLOADER=y
CONFIG_FOTA_DOWNLOAD=y

# =============================================================================
# Power: no UART, no logging, no console. An enabled UARTE alone draws
# ~0.6 mA - more than the whole PSM + accelerometer budget combined.
# =============================================================================
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_PM_DEVICE=y

# =============================================================================
# Robustness & hardening
# =============================================================================
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_CANARIES=y
CONFIG_REBOOT=y

# =============================================================================
# System
# =============================================================================
CONFIG_EVENTS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
